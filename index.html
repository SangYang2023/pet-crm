<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>全国宠物行业客户线索 CRM 系统</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2733; --muted:#6b7785;
    --line:#e6eaf0; --accent:#2f6df6; --accent2:#15b9a6; --soft:#eef3ff;
    --green:#19a974; --red:#e5533c; --orange:#f08a24; --gray:#94a3b8; --blue:#2f6df6; --teal:#15b9a6;
    --shadow:0 6px 22px rgba(31,39,51,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;background:linear-gradient(120deg,#2f6df6,#15b9a6);color:#fff;box-shadow:var(--shadow)}
  .topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
  .topbar .sub{font-size:12px;opacity:.85}
  .topbar .badge{margin-left:auto;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;font-size:12px}
  .tabs{display:flex;gap:4px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{padding:13px 18px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
  .tab.active{color:var(--accent);border-color:var(--accent)}
  .tab .cnt{background:var(--soft);color:var(--accent);border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
  .wrap{padding:20px 22px;max-width:1400px;margin:0 auto}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(5,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .label{color:var(--muted);font-size:12px;margin-bottom:8px}
  .kpi .val{font-size:26px;font-weight:800;line-height:1}
  .kpi .foot{font-size:11px;color:var(--muted);margin-top:6px}
  .two{grid-template-columns:1.3fr 1fr}
  .sec-title{font-weight:700;font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title small{font-weight:500;color:var(--muted);font-size:12px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;cursor:pointer}
  .bar-row:hover .bar-name{color:var(--accent)}
  .bar-name{width:120px;flex:none;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{flex:1;background:var(--soft);border-radius:6px;height:18px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,#2f6df6,#15b9a6);border-radius:6px}
  .bar-val{width:54px;text-align:right;font-size:12px;color:var(--muted);flex:none}
  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:12px;display:flex;flex-direction:column;gap:6px}
  .legend .li{display:flex;align-items:center;gap:7px}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:13px;background:#fff;color:var(--ink)}
  .toolbar input.search{flex:1;min-width:240px}
  .btn{border:none;background:var(--accent);color:#fff;height:38px;padding:0 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
  .btn.ghost{background:var(--soft);color:var(--accent)}
  .btn.mini{height:30px;padding:0 10px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;background:#fafbfd;cursor:pointer;user-select:none}
  tbody tr:hover{background:var(--soft);cursor:pointer}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .t-gray{background:#eef1f5;color:#5b6675}
  .t-green{background:#e2f6ec;color:#128a5b}
  .t-teal{background:#dff6f3;color:#0e8c7d}
  .t-red{background:#fde6e2;color:#c43d28}
  .t-orange{background:#fdeed9;color:#b9670f}
  .t-blue{background:#e2ecfe;color:#1f5bd6}
  .t-purple{background:#efe6fd;color:#7a40c0}
  .pager{display:flex;align-items:center;gap:10px;margin-top:14px;justify-content:flex-end}
  .empty{text-align:center;color:var(--muted);padding:50px}
  /* drawer */
  .mask{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;z-index:50}
  .mask.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:560px;max-width:94vw;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .25s ease;z-index:60;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .drawer-head h2{margin:0;font-size:18px}
  .drawer-head .x{margin-left:auto;cursor:pointer;font-size:22px;color:var(--muted);line-height:1}
  .drawer-body{padding:18px 22px;overflow:auto;flex:1}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:8px}
  .field{font-size:13px}
  .field .k{color:var(--muted);font-size:11px;margin-bottom:2px}
  .field .v{font-weight:600;word-break:break-all}
  .sec{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
  .fm-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .fm-row select,.fm-row input{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px}
  .fm-row input.owner, .fm-row select.owner{flex:1;min-width:120px}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;min-height:64px}
  .timeline{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .tl-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafbfd}
  .tl-item .t{font-size:11px;color:var(--muted);margin-bottom:4px}
  .tl-item .x{font-size:13px;white-space:pre-wrap;word-break:break-all}
  .hint{font-size:11px;color:var(--muted)}
  /* ---------- 响应式：平板（≤1000px） ---------- */
  @media(max-width:1000px){
    .topbar{flex-wrap:wrap;gap:8px 14px;padding:12px 16px}
    .topbar h1{font-size:16px}
    .topbar .sub{display:none}
    .topbar .badge{margin-left:0;padding:4px 10px}
    .topbar .badge#userBadge{margin-left:auto}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .two{grid-template-columns:1fr}
    .wrap{padding:16px}
    #tableHost{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{min-width:720px}
    .drawer{width:92vw}
  }
  /* ---------- 响应式：手机（≤640px） ---------- */
  /* ---------- 移动端筛选折叠（≤640px） ---------- */
  .m-filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .m-filter-bar input.search{flex:1;min-width:0}
  .m-filter-toggle{flex:none;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .m-filter-toggle .arr{transition:transform .2s;font-size:11px}
  .m-filter-toggle.open .arr{transform:rotate(180deg)}
  .m-filter-panel{display:none;flex-direction:column;gap:10px;margin-bottom:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .m-filter-panel.open{display:flex}
  .m-filter-row{display:flex;flex-wrap:wrap;gap:8px}
  .m-filter-row select{flex:1 1 calc(50% - 4px);min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:#fff}
  .m-filter-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .m-filter-actions .btn, .m-filter-actions .btn.ghost{flex:1 1 calc(50% - 4px);min-width:0;height:34px;padding:0 8px;font-size:12px;text-align:center}

  @media(max-width:640px){
    .topbar h1{flex:1 1 100%}
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 8px;white-space:nowrap}
    .tab{padding:12px 14px;font-size:13px;flex:none}
    .wrap{padding:12px 10px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .card{padding:14px}
    .card.kpi .val{font-size:22px}
    .toolbar input,.toolbar select{flex:1 1 100%;min-width:0}
    .toolbar input.search{flex:1 1 100%}
    .toolbar .btn{flex:1 1 auto;min-width:120px}
    .drawer{width:100%;max-width:100%}
    .field-grid{grid-template-columns:1fr}
    .fm-row select,.fm-row input{flex:1 1 100%}
    .modal-card{padding:20px}
    .pager{flex-wrap:wrap;justify-content:flex-end;gap:8px}
    .m-sort{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
    .m-sort select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;flex:1;background:#fff}
  }
  /* login */
  .login-mask{position:fixed;inset:0;background:linear-gradient(120deg,#2f6df6,#15b9a6);display:none;align-items:center;justify-content:center;z-index:200}
  .login-mask.show{display:flex}
  .login-card{background:#fff;border-radius:16px;padding:30px 28px;width:340px;max-width:92vw;box-shadow:0 24px 70px rgba(0,0,0,.32)}
  .login-card h2{margin:0 0 4px;font-size:20px}
  .login-card .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
  .login-card input{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:14px;margin-bottom:12px}
  .login-card .btn{width:100%;height:42px}
  .login-err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px}
  /* batch assign modal */
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:210}
  .modal-mask.show{display:flex}
  .modal-card{background:#fff;border-radius:16px;padding:24px 26px;width:480px;max-width:94vw;box-shadow:0 24px 70px rgba(0,0,0,.32)}
  .modal-card h2{margin:0 0 4px;font-size:19px}
  .modal-card .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
  .modal-card label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  .modal-card select{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn{flex:1}
  .btn.warn{background:linear-gradient(120deg,#e8590c,#f08c00)}
  .batch-preview{margin-top:14px;font-size:13px;color:var(--muted);min-height:18px}
  .star{cursor:pointer;font-size:16px;color:#cfcfcf;user-select:none;line-height:1}
  .star.on{color:#f5a623}
  /* ---------- 移动端卡片式列表（≤640px 启用） ---------- */
  .cards{display:flex;flex-direction:column;gap:10px}
  .lead-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);box-shadow:var(--shadow)}
  .lead-card:active{background:var(--soft)}
  .lead-card .row1{display:flex;align-items:flex-start;gap:10px}
  .lead-card .cchk{flex:none;margin-top:2px}
  .lead-card .cname{font-weight:700;font-size:15px;flex:1;line-height:1.35;word-break:break-all}
  .lead-card .cmeta{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:7px;font-size:12px;color:var(--muted)}
  .lead-card .cmeta a{color:var(--accent);text-decoration:none}
  .lead-card .ctags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .lead-card .cact{margin-top:11px;display:flex;gap:8px}
  .lead-card .cact .btn{flex:1}
</style>
</head>
<body>
  <div class="topbar">
    <h1>🐾 全国宠物行业客户线索 CRM</h1>
    <span class="sub">基于「客户线索 全国宠物 带手机号」· 企业级销售线索管理</span>
    <span class="badge" id="modeBadge">检测中…</span>
    <span class="badge" id="totalBadge">加载中…</span>
    <span class="badge" id="userBadge" style="cursor:pointer" onclick="doLogout()" title="点击退出登录">未登录</span>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="dash">📊 仪表盘<span class="cnt" id="cntAll">0</span></div>
    <div class="tab" data-tab="leads">📇 线索库</div>
    <div class="tab" data-tab="mine">⭐ 我的跟进<span class="cnt" id="cntMine">0</span></div>
    <div class="tab" data-tab="disabled">🚫 停用库<span class="cnt" id="cntDisabled">0</span></div>
    <div class="tab" data-tab="funnel">📈 转化漏斗</div>
  </div>

  <div class="wrap" id="view"></div>

  <!-- login -->
  <div class="login-mask" id="loginMask">
    <div class="login-card">
      <h2>🐾 宠物 CRM 登录</h2>
      <div class="sub">客户线索管理系统 · 请先登录</div>
      <div class="login-err" id="loginErr"></div>
      <input id="loginUser" placeholder="账号" autocomplete="username">
      <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn" id="loginBtn">登 录</button>
    </div>
  </div>

  <!-- batch assign modal (admin only) -->
  <div class="modal-mask" id="batchMask">
    <div class="modal-card">
      <h2>👥 批量分配客户</h2>
      <div class="sub">将勾选的客户指派给业务员</div>
      <label>指派给业务员</label>
      <select id="bOwner"></select>
      <div class="batch-preview" id="bPreview"></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeBatch()">取消</button>
        <button class="btn warn" onclick="batchAssign()">执行分配</button>
        <button class="btn ghost" style="color:var(--red);border-color:var(--red)" onclick="batchRelease()">🚫 释放归属</button>
      </div>
    </div>
  </div>

  <!-- 批量修改线索状态/优先级 -->
  <div class="modal-mask" id="editMask">
    <div class="modal-card">
      <h2>✏ 批量修改线索</h2>
      <div class="sub">将勾选客户的线索状态 / 优先级统一修改（留空表示该项不修改）</div>
      <label>线索状态</label>
      <select id="eLead"><option value="">— 不修改 —</option><option>待开发</option><option>跟进中</option><option>已成交</option><option>已流失</option><option>已放弃</option></select>
      <label>优先级</label>
      <select id="ePri"><option value="">— 不修改 —</option><option value="高">高优先级</option><option value="中">中优先级</option><option value="低">低优先级</option></select>
      <div class="batch-preview" id="ePreview"></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeEdit()">取消</button>
        <button class="btn warn" onclick="batchUpdate()">执行修改</button>
      </div>
    </div>
  </div>

  <!-- drawer -->
  <div class="mask" id="mask"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <h2 id="dName">—</h2>
        <div id="dSub" class="hint"></div>
      </div>
      <div class="x" id="dClose">✕</div>
    </div>
    <div class="drawer-body" id="dBody"></div>
  </div>

<script src="crm-data.js"></script>
<script>
const DATA = window.CRM_DATA || [];
const META = window.CRM_META || {};
const STORE_KEY = 'petCrmFollow_v1';
const LEAD_STATUSES = ['待开发','跟进中','已成交','已流失','已放弃'];
const PRIORITIES = ['高','中','低'];
const OWNERS = ['邱小波','何柯','王雄','蒲斌','杨兰香','阳云霞','张冲','刘长春','赵静','杨继磊'];
const BIZ_COLOR = {'存续':'t-green','在业':'t-teal','注销':'t-gray','撤销':'t-red','迁出':'t-orange'};
const LEAD_COLOR = {'待开发':'t-gray','跟进中':'t-blue','已成交':'t-green','已流失':'t-red','已放弃':'t-purple'};

let store = {};
let online = false;
let IS_ADMIN = false;
let ME = '';                           // 当前登录账号名（业务员）
let es = null;                       // SSE 连接
const MY_ID = Math.random().toString(36).slice(2);  // 本客户端唯一标识
let lsCount = 0;                     // 实时同步到的更新次数
const state = {tab:'dash', search:'', province:'', city:'', district:'', industry:'', bizStatus:'', leadStatus:'', priority:'', owner:'', star:'', sort:'name', page:1, pageSize:50, mobileLoaded:50};

async function initStore(){
  try{
    const r = await fetch('/api/followups');
    if(r.ok){ store = await r.json(); online = true; }
  }catch(e){ online = false; }
  if(!online){ try{ store = JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ store = {}; } }
  updateModeBadge();
  if(online) connectSSE();
}
/* ---------- 实时推送（SSE） ---------- */
function connectSSE(){
  if(es) return;
  try{ es = new EventSource('/api/events'); }catch(e){ return; }
  es.onmessage = (ev) => {
    try{
      const msg = JSON.parse(ev.data);
      if(msg.type!=='update') return;
      store = msg.store || store;
      lsCount++;
      updateModeBadge();
      render();
      if(msg.from && msg.from!==MY_ID) toast('🔄 团队线索已实时更新');
      else if(!msg.from) toast('🔄 线索已实时同步');
    }catch(_){}
  };
  es.onerror = () => { /* EventSource 会自动重连，无需处理 */ };
}
function updateModeBadge(){
  const el = document.getElementById('modeBadge');
  if(!el) return;
  if(!online){ el.textContent = '💾 本地存储'; return; }
  const live = es && es.readyState === 1;
  el.textContent = live ? `🟢 实时同步 · ${lsCount>0?('已同步 '+lsCount+' 次'):'在线'}` : '☁ 云端同步';
}
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
function syncRemote(id){
  if(!online) return;
  fetch('/api/followups/'+id, {method:'PUT', headers:{'Content-Type':'application/json','X-Client-Id':MY_ID}, body:JSON.stringify(store[id]||{})}).catch(()=>{});
}
function getLead(id){ return store[id] || null; }
// 当前登录用户是否可见该客户（与线索库规则一致：停用隐藏；非管理员只看未分配或本人）
function recordVisibleToUser(d){
  const l=getLead(d.id);
  if(l && l.disabled) return false;
  if(IS_ADMIN) return true;
  const owner = l ? (l.owner||'') : '';
  return !owner || owner===ME;
}
// 线索状态安全读取（彻底防御 undefined/"undefined"/null/空值）
function safeLS(l){
  if(!l) return '待开发';
  var s=String(l.leadStatus||'').trim();
  if(!s || s==='undefined' || s==='null') return '待开发';
  return s;
}
// 优先级安全读取（同上逻辑）
function safePR(l){
  if(!l) return '中';
  var s=String(l.priority||'').trim();
  if(!s || s==='undefined' || s==='null') return '中';
  return s;
}
function setLead(id, patch){
  const cur = store[id] || {leadStatus:'待开发', priority:'中', owner:'', nextDate:'', notes:[], updated:''};
  Object.assign(cur, patch); cur.updated = new Date().toISOString();
  store[id]=cur; saveStore(); syncRemote(id);
}
function copyText(t){ if(!t)return; navigator.clipboard?.writeText(t); toast('已复制：'+t); }
function toggleStar(id){
  const cur = getLead(id) || {};
  setLead(id, { star: !cur.star });
  toast(cur.star ? '已取消星标' : '已设为星标客户 ⭐');
}
function fmtTs(ts){ try{ const d=new Date(ts); const p=x=>(''+x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }catch(e){ return ts||''; } }
function historyHtml(l){
  const h = l && Array.isArray(l.history) ? l.history.slice().reverse() : [];
  if(!h.length) return '<div class="hint">暂无操作记录。</div>';
  return '<div class="timeline">'+h.map(n=>`<div class="tl-item"><div class="t">${fmtTs(n.ts)}</div><div class="x">${escapeHtml(n.action||'')}${n.by?' · '+escapeHtml(n.by):''}</div></div>`).join('')+'</div>';
}

/* ---------- filters ---------- */
function applyFilters(){
  const mode=state.tab;
  const onlyMine = mode==='mine';
  const onlyDisabled = mode==='disabled';
  const q = state.search.trim().toLowerCase();
  return DATA.filter(d=>{
    const l=getLead(d.id);
    if(onlyDisabled){ if(!l || !l.disabled) return false; }
    else if(l && l.disabled) return false;
    if(onlyMine){ if(!l || (l.owner||'')!==ME) return false; }
    // 线索库：非管理员只能看「未分配」或「分配给本人」的客户，分配给别人的对其隐藏
    if(mode==='leads' && !IS_ADMIN){
      const owner = l ? (l.owner||'') : '';
      if(owner && owner!==ME) return false;
    }
    if(state.province && d.province!==state.province) return false;
    if(state.city){
      const isMuni = MUNICIPALITIES.includes(state.province);
      if(isMuni && d.district!==state.city) return false;
      if(!isMuni && d.city!==state.city) return false;
    }
    if(state.district && d.district!==state.district) return false;
    if(state.industry && d.industry!==state.industry) return false;
    if(state.bizStatus && d.bizStatus!==state.bizStatus) return false;
    if(state.leadStatus){ const l=getLead(d.id); const ls=safeLS(l); if(ls!==state.leadStatus) return false; }
    if(state.priority){ const l=getLead(d.id); if(safePR(l)!==state.priority) return false; }
    if(state.owner){
      const o = l ? (l.owner||'') : '';
      if(state.owner==='__none__'){ if(o) return false; }       // 仅看未分配
      else if(o!==state.owner) return false;                    // 仅看指定业务员
    }
    if(state.star==='1' && !(l && l.star)) return false;       // 仅看星标客户
    if(q){
      const hay=(d.name+' '+d.phone+' '+d.legal+' '+d.creditCode+' '+d.industry+' '+d.city+' '+d.district+' '+d.email).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function sortRecs(arr){
  const s=state.sort;
  return arr.slice().sort((a,b)=>{
    if(s==='name') return a.name.localeCompare(b.name,'zh');
    if(s==='est') return (b.establishDate||'').localeCompare(a.establishDate||'');
    if(s==='cap') return parseFloat((b.regCapital||'0').replace(/[^0-9.]/g,''))-parseFloat((a.regCapital||'0').replace(/[^0-9.]/g,''));
    if(s==='province') return (a.province||'').localeCompare(b.province||'zh');
    if(s==='star') return (b&&b.star?1:0)-(a&&a.star?1:0);
    return 0;
  });
}

/* ---------- render dispatch ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===state.tab));
  document.getElementById('cntAll').textContent = DATA.length;
  document.getElementById('cntMine').textContent = countMine();
  document.getElementById('cntDisabled').textContent = countDisabled();
  if(state.tab==='dash') renderDash();
  else if(state.tab==='funnel') renderFunnel();
  else if(state.tab==='leads' || state.tab==='mine' || state.tab==='disabled') renderLeads();
}
function countMine(){ let n=0; for(const d of DATA){const l=getLead(d.id); if(l&&!l.disabled&&(l.owner||'')===ME)n++;} return n; }
function countDisabled(){ let n=0; for(const d of DATA){const l=getLead(d.id); if(l&&l.disabled)n++;} return n; }

/* ---------- 转化漏斗 & 销售业绩 ---------- */
function funnelColor(s){return {'待开发':'#94a3b8','跟进中':'#2f6df6','已成交':'#19a974','已流失':'#e5533c','已放弃':'#7a40c0'}[s]||'#ccc';}
function renderFunnel(){
  const counts={}; LEAD_STATUSES.forEach(s=>counts[s]=0);
  const owners={};
  const activeData = DATA.filter(d=>recordVisibleToUser(d));
  activeData.forEach(d=>{
    const l=getLead(d.id); const ls=safeLS(l);
    counts[ls]=(counts[ls]||0)+1;
    const ow=(l&&l.owner||'').trim();
    if(ow){ if(!owners[ow])owners[ow]={total:0,deal:0,follow:0}; owners[ow].total++; if(ls==='已成交')owners[ow].deal++; if(ls==='跟进中')owners[ow].follow++; }
  });
  const total=activeData.length, followed=total-counts['待开发'], deal=counts['已成交'];
  const max=Math.max(...LEAD_STATUSES.map(s=>counts[s]));
  const order=['待开发','跟进中','已成交','已流失','已放弃'];
  const funnelHtml=order.map(s=>`<div class="bar-row"><div class="bar-name">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${max?counts[s]/max*100:0}%;background:${funnelColor(s)}"></div></div><div class="bar-val">${counts[s]}</div></div>`).join('');
  const lb=Object.entries(owners).sort((a,b)=>b[1].deal-a[1].deal).map(([n,o])=>`<tr><td><b>${escapeHtml(n)}</b></td><td>${o.total}</td><td>${o.follow}</td><td>${o.deal}</td><td>${o.total?Math.round(o.deal/o.total*100):0}%</td></tr>`).join('');
  document.getElementById('view').innerHTML=`
  <div class="grid kpis">
    <div class="card kpi"><div class="label">跟进覆盖率</div><div class="val">${total?Math.round(followed/total*100):0}%</div><div class="foot">已跟进 ${followed} 家</div></div>
    <div class="card kpi"><div class="label">成交率</div><div class="val">${total?Math.round(deal/total*100):0}%</div><div class="foot">已成交 ${deal} 家</div></div>
    <div class="card kpi"><div class="label">跟进中</div><div class="val">${counts['跟进中']}</div><div class="foot">进行中</div></div>
    <div class="card kpi"><div class="label">流失/放弃</div><div class="val">${counts['已流失']+counts['已放弃']}</div><div class="foot">需复盘</div></div>
    <div class="card kpi"><div class="label">参与销售</div><div class="val">${Object.keys(owners).length}</div><div class="foot">位负责人</div></div>
  </div>
  <div class="grid two" style="margin-top:16px">
    <div class="card"><p class="sec-title">🔻 转化漏斗（按线索状态）</p>${funnelHtml}
      <p class="hint" style="margin-top:12px">待开发 → 跟进中 → 已成交 为主线；已流失/已放弃为退出环节。在「线索库」或客户详情中调整状态即可实时更新。</p>
    </div>
    <div class="card"><p class="sec-title">🏆 销售业绩排行（按负责人）</p>
      ${Object.keys(owners).length?`<table><thead><tr><th>负责人</th><th>分配</th><th>跟进中</th><th>成交</th><th>成交率</th></tr></thead><tbody>${lb}</tbody></table>`:'<div class="empty">暂无负责人分配，在客户详情中填写「负责人」即可上榜。</div>'}
    </div>
  </div>`;
}

function bizHex(k){return {'存续':'#19a974','在业':'#15b9a6','注销':'#94a3b8','撤销':'#e5533c','迁出':'#f08a24'}[k]||'#ccc';}
function donut(counts){
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,e)=>s+e[1],0);
  const r=52,c=2*Math.PI*r; let off=0;
  const segs=entries.map(([k,v])=>{
    const frac=v/total; const len=frac*c;
    const seg=`<circle r="${r}" cx="64" cy="64" fill="none" stroke="${bizHex(k)}" stroke-width="20" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)"></circle>`;
    off+=len; return seg;
  }).join('');
  return `<svg width="128" height="128" viewBox="0 0 128 128">${segs}<text x="64" y="60" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2733">${total}</text><text x="64" y="78" text-anchor="middle" font-size="11" fill="#6b7785">企业</text></svg>`;
}

function uniqueSorted(key){ return [...new Set(DATA.map(d=>d[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh')); }
function cityOptions(){
  if(!state.province) return uniqueSorted('city');
  // 直辖市：province=city（如"北京市"），此时用 district 作为二级筛选
  if(MUNICIPALITIES.includes(state.province)){
    return [...new Set(DATA.filter(d=>d.province===state.province).map(d=>d.district).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
  }
  return [...new Set(DATA.filter(d=>d.province===state.province).map(d=>d.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
}
// 第三级筛选：仅普通省份（非直辖市）选了城市后才显示区/县
function districtOptions(){
  if(!state.province || !state.city || MUNICIPALITIES.includes(state.province)) return [];
  return [...new Set(DATA.filter(d=>d.province===state.province && d.city===state.city).map(d=>d.district).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));

  const fs2=document.getElementById('fStar'); if(fs2) fs2.addEventListener('change',e=>{state.star=e.target.value;state.page=1;state.mobileLoaded=50;renderTableHost();});
  document.getElementById('btnReset').addEventListener('click',()=>{Object.assign(state,{search:'',province:'',city:'',district:'',industry:'',bizStatus:'',leadStatus:'',priority:'',owner:'',star:'',page:1,mobileLoaded:50});clearSelection();renderLeads();});
  const be=document.getElementById('btnExport'); if(be) be.addEventListener('click',()=>exportCSV());
  if(IS_ADMIN && !onlyDisabled){ const bb=document.getElementById('btnBatch'); if(bb) bb.addEventListener('click',openBatchAssign); const be2=document.getElementById('btnBatchEdit'); if(be2) be2.addEventListener('click',openBatchEdit); const baf=document.getElementById('btnAssignFilter'); if(baf) baf.addEventListener('click',assignByFilter); const br=document.getElementById('btnRelease'); if(br) br.addEventListener('click',batchRelease); const brf=document.getElementById('btnReleaseFilter'); if(brf) brf.addEventListener('click',releaseByFilter); }
  renderTableHost();
  refreshBatchBtn();
}
function renderTableHost(){
  const narrow = window.matchMedia('(max-width:640px)').matches;
  let arr=applyFilters();
  arr=sortRecs(arr);
  const total=arr.length;
  const pages=Math.max(1,Math.ceil(total/state.pageSize));
  if(state.page>pages)state.page=pages;
  const start=(state.page-1)*state.pageSize;
  const pageArr=arr.slice(start,start+state.pageSize);
  const sortMark=(k)=>state.sort===k?' ▾':'';
  const showCheck = IS_ADMIN && state.tab!=='disabled';
  const emptyMsg = state.tab==='disabled' ? '停用库为空，暂无已停用的客户' : '没有符合条件的线索';

  // ---------- 窄屏（手机）：卡片式列表 + 加载更多 ----------
  if(narrow){
    const shown=Math.min(total, state.mobileLoaded);
    const view=arr.slice(0, shown);
    const sortOpts=[['name','企业名称'],['est','成立时间'],['cap','注册资本'],['province','省份'],['star','星标优先']];
    const sortBar=`<div class="m-sort">排序 <select id="mSort" onchange="setSortMobile(this.value)">${sortOpts.map(([v,t])=>`<option value="${v}" ${state.sort===v?'selected':''}>${t}</option>`).join('')}</select></div>`;
    let cards;
    if(view.length===0){
      cards=`<div class="empty">${emptyMsg}</div>`;
    } else {
      cards=view.map(d=>{
        const l=getLead(d.id); const ls=safeLS(l); const pr=safePR(l);
        const checked = SELECTED_IDS.has(d.id) ? 'checked' : '';
        let opBtn;
        if(state.tab==='disabled'){
          if(IS_ADMIN) opBtn=`<button class="btn mini" style="background:var(--green);color:#fff" onclick="event.stopPropagation();enableLead(${d.id})">启用</button>`;
          else opBtn=`<button class="btn mini ghost" onclick="event.stopPropagation();openDetail(${d.id})">查看</button>`;
        } else {
          opBtn=`<button class="btn mini ghost" onclick="event.stopPropagation();openDetail(${d.id})">跟进</button>`;
        }
        const area=(function(){ const p=d.province||'', c=d.city||'', ds=d.district||''; const parts=[p]; if(c) parts.push(c); if(ds) parts.push(ds); return parts.join(' '); })();
        const chk=showCheck?`<label class="cchk" onclick="event.stopPropagation()"><input type="checkbox" class="row-chk" data-id="${d.id}" ${checked} onchange="onRowCheck(${d.id},this.checked)"></label>`:'';
        const tags=`<div class="ctags">
          <span class="tag ${BIZ_COLOR[d.bizStatus]||'t-gray'}">${d.bizStatus||'—'}</span>
          <span class="tag ${LEAD_COLOR[ls]}">${ls}</span>
          ${pr!=='中'?`<span class="tag t-orange">${pr}</span>`:''}
          ${(l&&l.owner)?`<span class="tag t-blue">${l.owner}</span>`:'<span class="tag t-gray">未分配</span>'}
        </div>`;
        const meta=`<div class="cmeta">
          <span>📍 ${area}</span>
          <span>🏷️ ${d.industry||'—'}</span>
          <span>👤 ${d.legal||'—'}</span>
          <span>📞 <a href="javascript:copyText('${d.phone}')" onclick="event.stopPropagation()">${d.phone||'—'}</a></span>
        </div>`;
        return `<div class="lead-card" onclick="openDetail(${d.id})">
          <div class="row1">${chk}<span class="star ${l&&l.star?'on':''}" onclick="event.stopPropagation();toggleStar(${d.id})">${l&&l.star?'★':'☆'}</span><div class="cname">${d.name}</div></div>
          ${meta}${tags}
          <div class="cact">${opBtn}</div>
        </div>`;
      }).join('');
    }
    const more = shown<total ? `<button class="btn ghost" id="btnMore" style="width:100%;margin-top:2px" onclick="loadMore()">⬇ 加载更多（剩余 ${total-shown} 条）</button>` : '';
    const pager=`<div class="pager" style="justify-content:space-between"><span class="hint">已显示 ${shown.toLocaleString()} / 共 ${total.toLocaleString()} 条</span></div>`;
    document.getElementById('tableHost').innerHTML=`${sortBar}<div class="cards">${cards}</div>${more}`+pager;
    return;
  }

  // ---------- 宽屏（桌面/平板）：表格 ----------
  const head=`<table><thead><tr>
    ${showCheck?`<th style="width:36px"><input type="checkbox" id="chkAll" onchange="toggleSelectAll(this.checked)"></th>`:''}
    <th style="width:34px" onclick="setSort('star')" title="按星标排序">★${sortMark('star')}</th>
    <th onclick="setSort('name')">企业名称${sortMark('name')}</th>
    <th onclick="setSort('province')">地区${sortMark('province')}</th>
    <th>行业</th>
    <th>经营状态</th>
    <th>电话</th>
    <th>法人</th>
    <th>线索状态</th>
    <th>业务员归属</th>
    <th>操作</th>
  </tr></thead><tbody>`;
  let body;
  if(pageArr.length===0){
    body=`<tr><td colspan="${showCheck?11:10}"><div class="empty">${emptyMsg}</div></td></tr>`;
  } else {
    body=pageArr.map(d=>{
      const l=getLead(d.id); const ls=safeLS(l); const pr=safePR(l);
      let opBtn;
      if(state.tab==='disabled'){
        if(IS_ADMIN) opBtn=`<button class="btn mini" style="background:var(--green);color:#fff" onclick="event.stopPropagation();enableLead(${d.id})">启用</button>`;
        else opBtn=`<button class="btn mini ghost" onclick="event.stopPropagation();openDetail(${d.id})">查看</button>`;

      }
      const checked = SELECTED_IDS.has(d.id) ? 'checked' : '';
      return `<tr onclick="openDetail(${d.id})">
        ${showCheck?`<td onclick="event.stopPropagation()"><input type="checkbox" class="row-chk" data-id="${d.id}" ${checked} onchange="onRowCheck(${d.id},this.checked)"></td>`:''}
        <td><span class="star ${l&&l.star?'on':''}" title="星标客户" onclick="event.stopPropagation();toggleStar(${d.id})">${l&&l.star?'★':'☆'}</span></td>
        <td><b>${d.name}</b></td>
        <td>${(function(){ const p=d.province||'', c=d.city||'', ds=d.district||''; const parts=[p]; if(c) parts.push(c); if(ds) parts.push(ds); return parts.join(' '); })()}</td>
        <td>${d.industry||'<span class="hint">—</span>'}</td>
        <td><span class="tag ${BIZ_COLOR[d.bizStatus]||'t-gray'}">${d.bizStatus||'—'}</span></td>
        <td>${d.phone?`<a href="javascript:copyText('${d.phone}')" onclick="event.stopPropagation()">${d.phone}</a>`:'—'}</td>
        <td>${d.legal||'—'}</td>
        <td><span class="tag ${LEAD_COLOR[ls]}">${ls}</span> ${pr!=='中'?`<span class="tag t-orange">${pr}</span>`:''}</td>
        <td>${(l&&l.owner)?`<span class="tag t-blue">${l.owner}</span>`:'<span class="hint">—</span>'}</td>
        <td>${opBtn}</td>
      </tr>`;
    }).join('');
  }
  const table=head+body+`</tbody></table>`;
  const pager=`<div class="pager"><span class="hint">共 ${total.toLocaleString()} 条 · 第 ${state.page}/${pages} 页</span>
    <button class="btn ghost mini" onclick="goPage(-1)">上一页</button>
    <button class="btn ghost mini" onclick="goPage(1)">下一页</button></div>`;
  document.getElementById('tableHost').innerHTML=table+pager;
}

async function disableLead(id){
  const d=DATA.find(x=>x.id===id); if(!d)return;
  if(!confirm(`确认停用「${d.name}」？\n停用后将退出线索库，仅管理员可在「停用库」重新启用。`)) return;
  const cur=getLead(id)||{leadStatus:'待开发',priority:'中',owner:'',notes:[]};
  cur.disabled=true; cur.updated=new Date().toISOString(); store[id]=cur; saveStore();
  try{ await fetch('/api/followups/'+id+'/disable',{method:'POST',headers:{'X-Client-Id':MY_ID}}); }catch(e){}
  toast('已停用：'+d.name);
  closeDrawer(); render();

async function enableLead(id){
  const d=DATA.find(x=>x.id===id); if(!d)return;
  const cur=getLead(id)||{leadStatus:'待开发',priority:'中',owner:'',notes:[]};
  cur.disabled=false; cur.updated=new Date().toISOString(); store[id]=cur; saveStore();

function addNote(id){
  const ta=document.getElementById('dNote'); const txt=ta.value.trim();

  l.notes.push({t:new Date().toLocaleString('zh-CN'),text:txt});
  setLead(id,l);
  ta.value='';

function copyCard(id){

/* ---------- EXPORT ---------- */
function exportCSV(){
  const mode=state.tab;
  let arr=applyFilters(); arr=sortRecs(arr);
  const head=['企业名称','省份','城市','区县','行业','经营状态','电话','法人','邮箱','注册资本','成立时间','线索状态','优先级','负责人','下次跟进','跟进记录数','是否停用'];
  const rows=arr.map(d=>{const l=getLead(d.id)||{};return [d.name,d.province,d.city,d.district,d.industry,d.bizStatus,d.phone,d.legal,d.email,d.regCapital,d.establishDate,safeLS(l),safePR(l),l.owner||'',l.nextDate||'',(l.notes?l.notes.length:0),l.disabled?'是':'否'];});
  const csv='\ufeff'+[head,...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const label = mode==='mine'?'我的跟进':mode==='disabled'?'停用库':'全部';
  a.download=`宠物客户线索_${label}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); toast('已导出 '+arr.length+' 条');
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)';document.body.appendChild(t);}
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity='0',1800);
}

async function checkAuth(){
  try{ const r=await fetch('/api/me'); if(r.ok){ const j=await r.json(); IS_ADMIN=!!j.isAdmin; ME=j.user||''; return j.user||null; } }catch(e){}
  return null;
}
function showLogin(){
  const m=document.getElementById('loginMask'); if(m) m.classList.add('show');
  const u=document.getElementById('loginUser'), p=document.getElementById('loginPass');
  const fire=()=>doLogin();
  document.getElementById('loginBtn').onclick=fire;
  [u,p].forEach(el=>el&&el.addEventListener('keydown',e=>{ if(e.key==='Enter') fire(); }));
  if(u) u.focus();

async function doLogin(){
  const u=(document.getElementById('loginUser').value||'').trim();
  const p=document.getElementById('loginPass').value||'';
  const err=document.getElementById('loginErr');
  if(!u||!p){ err.textContent='请输入账号和密码'; return; }
  err.textContent='登录中…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})});
    if(r.ok){ location.reload(); }
    else { err.textContent='账号或密码错误'; }
  }catch(e){ err.textContent='网络错误，请重试'; }
}
async function doLogout(){
  try{ await fetch('/api/logout',{method:'POST'}); }catch(e){}
  location.reload();
}

/* ---------- 勾选 & 批量分配（管理员） ---------- */
const SELECTED_IDS = new Set();
function onRowCheck(id, checked){
  if(checked) SELECTED_IDS.add(id); else SELECTED_IDS.delete(id);
  refreshBatchBtn();
}
function toggleSelectAll(checked){
  const arr = applyFilters();
  if(checked) arr.forEach(d=>SELECTED_IDS.add(d.id));
  else arr.forEach(d=>SELECTED_IDS.delete(d.id));
  // 刷新当前页面的 checkbox 状态
  document.querySelectorAll('.row-chk').forEach(el=>{
    el.checked = checked;
  });
  refreshBatchBtn();
}
function clearSelection(){
  SELECTED_IDS.clear();
  document.querySelectorAll('.row-chk').forEach(el=>{el.checked=false;});
  const ca=document.getElementById('chkAll'); if(ca) ca.checked=false;
  refreshBatchBtn();
}
function refreshBatchBtn(){
  const bb=document.getElementById('btnBatch');
  if(bb){
    bb.disabled = SELECTED_IDS.size===0;
    bb.textContent = SELECTED_IDS.size>0 ? `👥 批量分配(${SELECTED_IDS.size})` : '👥 批量分配';
    bb.style.opacity = SELECTED_IDS.size>0 ? '1' : '0.5';
  }
  const br=document.getElementById('btnRelease');
  if(br){
    br.disabled = SELECTED_IDS.size===0;
    br.textContent = SELECTED_IDS.size>0 ? `🚫 批量释放(${SELECTED_IDS.size})` : '🚫 批量释放';
    br.style.opacity = SELECTED_IDS.size>0 ? '1' : '0.5';
  }
  const be2=document.getElementById('btnBatchEdit');
  if(be2){
    be2.disabled = SELECTED_IDS.size===0;
    be2.textContent = SELECTED_IDS.size>0 ? `✏ 批量改(${SELECTED_IDS.size})` : '✏ 批量改';
    be2.style.opacity = SELECTED_IDS.size>0 ? '1' : '0.5';
  }
}
let BATCH_SCOPE='selected';
function openBatchAssign(){
  if(SELECTED_IDS.size===0){ toast('请先勾选要分配的客户'); return; }
  BATCH_SCOPE='selected';
  const m=document.getElementById('batchMask'); if(m) m.classList.add('show');
  const ow=document.getElementById('bOwner');
  ow.innerHTML=OWNERS.map(o=>`<option>${o}</option>`).join('');
  ow.value=OWNERS[0];
  document.getElementById('bPreview').textContent=`已选择 ${SELECTED_IDS.size} 家客户`;
}
function assignByFilter(){
  const ids=applyFilters().map(d=>d.id);
  if(ids.length===0){ toast('当前筛选条件下没有可分配的客户'); return; }
  BATCH_SCOPE='filter';
  const m=document.getElementById('batchMask'); if(m) m.classList.add('show');
  const ow=document.getElementById('bOwner');
  ow.innerHTML=OWNERS.map(o=>`<option>${o}</option>`).join('');
  ow.value=OWNERS[0];
  document.getElementById('bPreview').textContent=`当前筛选结果共 ${ids.length} 家（将全量指派，不受勾选影响）`;
}
function closeBatch(){ const m=document.getElementById('batchMask'); if(m) m.classList.remove('show'); }
async function batchAssign(){
  const owner=document.getElementById('bOwner').value;
  let ids;
  if(BATCH_SCOPE==='filter') ids=applyFilters().map(d=>d.id);
  else ids=[...SELECTED_IDS];
  if(ids.length===0){ toast('没有可分配的客户'); return; }
  const tip = BATCH_SCOPE==='filter' ? `（当前筛选结果 ${ids.length} 家）` : `（已选 ${ids.length} 家）`;
  if(!confirm(`确认将 ${ids.length} 家客户指派给「${owner}」？${tip}`)) return;
  try{
    const r=await fetch('/api/followups/batch-assign',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':MY_ID},body:JSON.stringify({ids,owner})});
    if(r.ok){ const j=await r.json(); closeBatch(); clearSelection(); BATCH_SCOPE='selected'; await initStore(); render(); toast(`已成功分配 ${j.count} 家客户给 ${owner}`); }
    else { const j=await r.json().catch(()=>({})); toast(j.error==='forbidden'?'无权限：仅管理员可执行批量分配':'分配失败，请重试'); }
  }catch(e){ toast('网络错误，请重试'); }
}
async function batchRelease(){
  const ids=[...SELECTED_IDS];
  if(ids.length===0){ toast('请先勾选要释放归属的客户'); return; }
  if(!confirm(`确认将 ${ids.length} 家客户释放归属（设为未分配）？`)) return;
  try{
    const r=await fetch('/api/followups/batch-release',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':MY_ID},body:JSON.stringify({ids})});
    if(r.ok){ const j=await r.json(); closeBatch(); clearSelection(); await initStore(); render(); toast(`已释放 ${j.count} 家客户的归属`); }
    else { const j=await r.json().catch(()=>({})); toast(j.error==='forbidden'?'无权限：仅管理员可释放归属':'释放失败，请重试'); }
  }catch(e){ toast('网络错误，请重试'); }
}
function openBatchEdit(){
  if(SELECTED_IDS.size===0){ toast('请先勾选要修改的客户'); return; }
  const m=document.getElementById('editMask'); if(m) m.classList.add('show');
  document.getElementById('eLead').value='';
  document.getElementById('ePri').value='';
  document.getElementById('ePreview').textContent=`已选择 ${SELECTED_IDS.size} 家客户`;
}
function closeEdit(){ const m=document.getElementById('editMask'); if(m) m.classList.remove('show'); }
async function batchUpdate(){
  const ids=[...SELECTED_IDS];
  const ls=document.getElementById('eLead').value;
  const pr=document.getElementById('ePri').value;
  if(ids.length===0){ toast('没有选中的客户'); return; }
  if(!ls && !pr){ toast('请至少选择要修改的「线索状态」或「优先级」'); return; }
  const tip = (ls?('线索状态改为「'+ls+'」'):'') + ((ls&&pr)?'、':'') + (pr?('优先级改为「'+pr+'」'):'');
  if(!confirm(`确认将 ${ids.length} 家客户的${tip}？`)) return;
  try{
    const r=await fetch('/api/followups/batch-update',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':MY_ID},body:JSON.stringify({ids,leadStatus:ls||undefined,priority:pr||undefined})});
    if(r.ok){ const j=await r.json(); closeEdit(); clearSelection(); await initStore(); render(); toast(`已修改 ${j.count} 家客户`); }
    else { toast('修改失败，请重试'); }
  }catch(e){ toast('网络错误，请重试'); }
}

async function releaseByFilter(){
  const ids=applyFilters().map(d=>d.id);
  if(ids.length===0){ toast('当前筛选条件下没有可释放的客户'); return; }
  if(!confirm(`确认将当前筛选结果中的 ${ids.length} 家客户全部释放归属（设为未分配）？\n此操作会覆盖当前勾选，作用于整个筛选结果，不可撤销。`)) return;
  try{
    const r=await fetch('/api/followups/batch-release',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':MY_ID},body:JSON.stringify({ids})});
    if(r.ok){ const j=await r.json(); clearSelection(); await initStore(); render(); toast(`已释放 ${j.count} 家客户的归属`); }
    else { const j=await r.json().catch(()=>({})); toast(j.error==='forbidden'?'无权限：仅管理员可释放归属':'释放失败，请重试'); }
  }catch(e){ toast('网络错误，请重试'); }
}

  }catch(e){ toast('网络错误，请重试'); }
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{state.tab=t.dataset.tab;state.page=1;state.mobileLoaded=50;render();}));
/* ---------- 跨断点重渲染线索列表（避免卡片/表格错位） ---------- */
let _lastNarrow = window.matchMedia('(max-width:640px)').matches;
let _rsTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(_rsTimer);
  _rsTimer=setTimeout(()=>{
    const n=window.matchMedia('(max-width:640px)').matches;
    if(n!==_lastNarrow){ _lastNarrow=n;
      if(state.tab==='leads'||state.tab==='mine'||state.tab==='disabled') renderTableHost();
    }
  },200);
});

  if(DATA.length){
    document.getElementById('totalBadge').textContent=DATA.length.toLocaleString()+' 家企业';

    document.getElementById('view').innerHTML='<div class="empty">数据加载失败，请确认 crm-data.js 与本页面在同一目录且已登录。</div>';
  }
})();
